name: Refresh news and deploy to GitHub Pages
on:
  push: {branches: [main]}
  schedule: [{cron: "0 */6 * * *"}]   # every 6 hours (scheduled runs use the default branch)
  workflow_dispatch: {}
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run news:test
      - name: Fetch news (a failure keeps the previous data)
        run: npm run news:fetch
        continue-on-error: true
      - name: Commit news data only when it changed
        run: |
          git config user.name "news-bot"; git config user.email "news-bot@users.noreply.github.com"
          git add public/data/news.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "chore: refresh news"; git pull --rebase; git push; fi
      - name: Base path
        run: |
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ] || [[ "${{ github.event.repository.name }}" == *.github.io ]]; then echo "NEXT_PUBLIC_BASE_PATH=" >> $GITHUB_ENV; else echo "NEXT_PUBLIC_BASE_PATH=/${{ github.event.repository.name }}" >> $GITHUB_ENV; fi
          echo "NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}" >> $GITHUB_ENV
      - uses: actions/configure-pages@v5
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: {path: out}
      - id: deployment
        uses: actions/deploy-pages@v4
