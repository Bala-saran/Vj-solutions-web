name: Refresh technology news
on:
  schedule: [{cron: "0 5 * * *"}]   # daily 05:00 UTC; change to adjust frequency
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run news:test
      - run: npm run news:fetch
        env: {NEWS_MAX_AGE_DAYS: "90", NEWS_MAX_ITEMS: "400"}
      - name: Commit updated news
        run: |
          git config user.name "news-bot"; git config user.email "news-bot@users.noreply.github.com"
          git add src/data/news.json; git diff --cached --quiet || (git commit -m "chore: refresh news" && git push)
